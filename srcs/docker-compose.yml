version: "3.8"

services:
  mariadb:
    build: requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

  wordpress:
    build: requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    restart: unless-stopped

  nginx:
    build: requirements/nginx
    image: nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
    restart: unless-stopped

  redis:
    build: requirements/bonus/redis
    image: redis
    container_name: redis
    networks:
      - inception
    restart: unless-stopped

  static_site:
    build: requirements/bonus/static_site
    image: static_site
    container_name: static_site
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: unless-stopped

  adminer:
    build: requirements/bonus/adminer
    image: adminer
    container_name: adminer
    networks:
     - inception
    ports:
     - "8081:8081"
    restart: unless-stopped

  status_dashboard:
    build: requirements/bonus/status_dashboard
    image: status_dashboard
    container_name: status_dashboard
    ports:
      - "8082:8082"
    networks:
      - inception
    restart: unless-stopped

  ftp:
    build: requirements/bonus/ftp
    image: ftp
    container_name: ftp
    secrets:
      - ftp_user
      - ftp_password
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    restart: unless-stopped
  
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jomunoz42/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jomunoz42/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_user:
    file: ../secrets/ftp_user.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
